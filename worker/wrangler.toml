name = "openfrontier-translate"
main = "worker.js"
compatibility_date = "2024-12-01"

# Origins allowed to use the proxy. Update the github.io URL to your own.
# Leave this var out entirely to allow any origin (not recommended once public).
[vars]
ALLOWED_ORIGINS = "http://localhost:8000,https://YOUR_USERNAME.github.io"

# GEMINI_API_KEY is NOT stored here — it's a secret. Set it with:
#   wrangler secret put GEMINI_API_KEY
